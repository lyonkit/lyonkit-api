[package]
name = "migration"
version = "0.1.0"
edition = "2021"
authors = ["Léo Coletta <leo.coletta@pm.me>"]
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
entity = { path = "../entity" }
sea-orm-migration = { version = "0.12.15", features = ["sqlx-postgres", "runtime-tokio-native-tls"] }
chrono = "0.4.42"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tokio = { version = "1.48.0", features = ["macros"] }
openssl = { version = "0.10.75", features = ["vendored"] }
openssl-probe = "0.2.0"
