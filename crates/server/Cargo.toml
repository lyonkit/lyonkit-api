[package]
name = "server"
version = "0.1.0"
edition = "2021"
authors = ["Léo Coletta <leo.coletta@pm.me>"]
publish = false

[dependencies]
entity = { path = "../entity" }
migration = { path = "../migration" }
actix-web = "4.12.1"
actix-multipart = { version = "0.7.2" }
actix-cors = { version = "0.7.1" }
mime = { version = "0.3.17" }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "fs"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
serde = "1.0.228"
tracing = "0.1.44"
tracing-actix-web = { version = "0.7.20", features = ["default", "opentelemetry_0_17"] }
opentelemetry = { version = "0.31.0", features = ["rt-tokio-current-thread"] }
opentelemetry-jaeger = { version = "0.22.0", features = ["rt-tokio-current-thread"] }
tracing-opentelemetry = { version = "0.32.0" }
tracing-subscriber = { version = "0.3.22", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
sea-orm = { version = "0.12.15", features = ["debug-print", "runtime-tokio-native-tls", "sqlx-postgres", "postgres-array"] }
config = { version = "0.15.19" }
serde_json = "1.0.148"
chrono = "0.4.42"
futures = "0.3.31"
getset = "0.1.6"
uuid = { version = "1.19.0", features = ["serde"] }
derive_more = "0.99.20"
url = "2.5.7"
async-trait = "0.1.89"
once_cell = "1.21.3"
aws-sdk-s3 = { version = "0.39.1", features = ["native-tls", "rt-tokio"], default-features = false }
aws-types = { version = "0.101.0" }
aws-config = { version = "0.101.0", features = ["native-tls", "rt-tokio"], default-features = false }
aws-smithy-http = { version = "0.62.6", features = ["rt-tokio"] }
aws-smithy-async = { version = "0.101.0", features = ["rt-tokio"] }
image = { version = "0.25.9" }
openssl = { version = "0.10.75", features = ["vendored"] }
openssl-probe = "0.2.0"
deunicode = { version = "1.6.2" }
lazy_static = { version = "1.5.0" }
base64 = "0.22.1"
reqwest = { version = "0.13.1", features = ["json", "cookies", "multipart", "stream"] }
typed-builder = "0.23.2"
humansize = { version = "2.1.3", features = ["impl_style"] }
aws-credential-types = "0.101.0"

[dev-dependencies]
insta = { version = "1.45.1", features = ["json"] }
portpicker = "0.1.1"
test-context = "0.5.4"
